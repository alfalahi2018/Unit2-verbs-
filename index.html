<title>Verb Safari</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: dot-grid notebook paper. Menu = big title with a sticker word + three hard-shadow level cards.
   Level = outlined pill header, highlighter instruction, chip word bank, dashed picture cards (solid green when solved). */
:root{
  --paper:#F2F5FA; --dot:rgba(20,22,28,.10); --ink:#14161C; --muted:#586070;
  --card:#FFFFFF; --line:#14161C; --edge:#14161C;
  --l1:#3BA3F2; --l2:#22B58A; --l3:#FFB400;
  --l1-soft:#CDE6FC; --l2-soft:#C6EEDF; --l3-soft:#FFE8A3;
  --tint1:#D6ECFD; --tint2:#D3F3E7; --tint3:#FFEFBF;
  --on-accent:#14161C; --art:#FFFFFF; --art-ink:#14161C;
  --good:#1B9E5E; --good-soft:#DDF6E8; --bad:#E5484D;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#12151B; --dot:rgba(242,244,248,.08); --ink:#F2F4F8; --muted:#A3ACBA;
    --card:#1C2029; --line:#F2F4F8; --edge:#05070A;
    --l1-soft:#1D3A57; --l2-soft:#154235; --l3-soft:#5A4300; --good-soft:#12382A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12151B; --dot:rgba(242,244,248,.08); --ink:#F2F4F8; --muted:#A3ACBA;
  --card:#1C2029; --line:#F2F4F8; --edge:#05070A;
  --l1-soft:#1D3A57; --l2-soft:#154235; --l3-soft:#5A4300; --good-soft:#12382A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background-color:var(--paper); color:var(--ink);
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.5px); background-size:22px 22px;
  font-family:var(--body); font-size:16px; line-height:1.45;
  padding-block:10px 30px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:920px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--lv,var(--ink));outline-offset:3px}

/* top strip */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px}
.topic{font-weight:800;font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ghost{display:inline-flex;align-items:center;gap:6px;padding:8px 14px 8px 10px;background:var(--card);color:var(--ink);
  border:2.5px solid var(--line);border-radius:12px;font-weight:800;box-shadow:0 3px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.ghost.sq{padding:8px}
.ghost:active,.chip:active,.primary:active{transform:translateY(3px);box-shadow:0 0 0 var(--edge)}

/* menu */
.hero{padding-top:14px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.8rem,10vw,4.8rem);line-height:1.12;margin:0;letter-spacing:-.01em}
.sticker{display:inline-block;background:var(--l3);color:#14161C;border:3px solid var(--line);border-radius:16px;
  padding:0 .25em;transform:rotate(-3deg);box-shadow:5px 5px 0 var(--edge);margin-left:.05em}
.lead{font-size:1.12rem;font-weight:700;margin:14px 0 0;max-width:34ch;color:var(--muted)}
.levels{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;margin-top:28px;padding-right:6px;padding-bottom:6px}
@media (min-width:760px){.levels{grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}}
.lvcard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:18px 18px 18px;
  background:var(--card);border:3px solid var(--line);border-radius:22px;box-shadow:6px 6px 0 var(--lv);
  transition:transform .1s,box-shadow .1s;animation:rise .45s both;animation-delay:calc(var(--n,0)*70ms)}
.lvcard:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--lv)}
.lvcard:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--lv)}
.stars{display:flex;gap:3px}
.stars .star{width:30px;height:30px}
.lname{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1.05;margin-top:4px}
.ldesc{font-weight:700;color:var(--muted);font-size:.98rem}
.bestchip{margin-top:6px;font-size:.78rem;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--lv);color:var(--on-accent)}
.star path{fill:var(--card);stroke:var(--line);stroke-width:1.8;stroke-linejoin:round}
.star.on path{fill:var(--lv)}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}

/* level screen */
#screen[data-level="1"]{--lv:var(--l1);--lv-soft:var(--l1-soft);--tint:var(--tint1)}
#screen[data-level="2"]{--lv:var(--l2);--lv-soft:var(--l2-soft);--tint:var(--tint2)}
#screen[data-level="3"]{--lv:var(--l3);--lv-soft:var(--l3-soft);--tint:var(--tint3)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
.prog{display:flex;align-items:center;gap:10px}
.dots{display:flex;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--line);background:var(--card)}
.dot.on{background:var(--lv)}
.plabel{font-weight:800;font-variant-numeric:tabular-nums;min-width:3.4ch}
.sechead{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-top:18px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:4px 20px 4px 14px;background:var(--card);
  border:3px solid var(--line);border-radius:999px;box-shadow:0 5px 0 var(--lv)}
.pill .stars .star{width:26px;height:26px}
.pill b{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1.2}
.instr{margin:0;font-weight:800;font-size:1.08rem;line-height:1.9;flex:1 1 220px}
.brush{padding:.12em .6em;background:linear-gradient(transparent 14%,var(--lv-soft) 14% 86%,transparent 86%);
  border-radius:10px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.chip{font-family:var(--body);font-weight:800;font-size:1.08rem;line-height:1;padding:12px 18px;background:var(--card);color:var(--ink);
  border:2.5px solid var(--line);border-radius:12px;box-shadow:0 3px 0 var(--edge);transition:transform .08s,box-shadow .08s,background .1s}
.chip.sel{background:var(--lv);color:var(--on-accent);transform:translateY(-3px);box-shadow:0 6px 0 var(--edge)}
.chip.used{opacity:.4;text-decoration:line-through;box-shadow:none;pointer-events:none}
.hint{min-height:1.5em;margin:12px 0 0;font-weight:700;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:12px}
@media (min-width:720px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}}
.pic,.cardw{position:relative;display:flex;flex-direction:column;gap:8px;padding:8px 8px 10px;text-align:left;
  background:var(--art);color:var(--art-ink);border:3px dashed var(--line);border-radius:18px;min-width:0}
.pic{transition:transform .1s,box-shadow .1s}
.pic:hover{transform:translateY(-2px)}
.pic.sel{border-style:solid;box-shadow:0 0 0 5px var(--lv);transform:translateY(-3px)}
.art{display:grid;place-items:center;aspect-ratio:5/4;width:100%}
.art img{width:100%;height:100%;object-fit:contain;display:block}
.num{position:absolute;top:8px;left:8px;z-index:1;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;
  border:2.5px solid #14161C;background:#fff;color:#14161C;font-family:var(--display);font-weight:800;font-size:1rem;line-height:1}
.slot{min-height:46px;display:grid;place-items:center;padding:4px 8px;border:2.5px dashed #98A1B1;border-radius:12px;background:#fff;
  font-weight:800;font-size:1.08rem;text-align:center}
.tick{display:none;position:absolute;top:8px;right:8px;z-index:1;width:28px;height:28px;border-radius:50%;background:var(--good);place-items:center}
.ok>.tick{display:grid}
.ok{border-style:solid;border-color:var(--good)}
.ok .slot{background:var(--good-soft);border:2.5px solid var(--good);color:#0E5A37}
.pic.ok .slot{background:#DDF6E8}
.bad{border-color:var(--bad)}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

.ans,.blank{border:0;border-bottom:3px solid var(--line);background:transparent;border-radius:0;outline:none;
  font-family:var(--display);font-weight:700;font-size:1.15rem;text-align:center;padding:4px 4px;min-width:0}
.ans{width:100%;color:var(--art-ink);border-bottom-color:#14161C;background:var(--tint)}
.ans:focus{box-shadow:0 4px 0 -1px var(--lv)}
.ok .ans{color:#0E5A37;background:transparent}
.bad .ans{border-bottom-color:var(--bad)}

.sents{display:grid;gap:12px;margin-top:14px}
.srow{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);
  border:3px solid var(--line);border-radius:18px}
.srow .num{position:static;flex:none}
.srow .tick{position:static;flex:none;margin-left:auto}
.sent{margin:0;font-size:1.15rem;line-height:2.5;min-width:0;flex:1 1 auto}
.blank{width:9.5rem;max-width:100%;color:var(--ink)}
.blank:focus{background:var(--lv-soft);border-bottom-color:var(--lv)}
.srow.ok{background:var(--good-soft)}
.srow.ok .blank{color:var(--good);background:transparent}
.srow.bad .blank{border-bottom-color:var(--bad)}

.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.primary{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;background:var(--lv);color:var(--on-accent);
  font-weight:800;font-size:1.1rem;border:3px solid var(--line);border-radius:14px;box-shadow:0 5px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.actions .ghost{padding:12px 18px;font-size:1.05rem}

/* result */
.result{display:grid;gap:12px;justify-items:start;padding-top:22px}
.rstars{display:flex;gap:8px}
.rstars .star{width:72px;height:72px;transform:scale(.82);transition:transform .3s}
.rstars .star path{stroke-width:1.6}
.rstars .star.on{transform:scale(1);animation:pop .55s}
.rstars .star.on path{fill:var(--l3)}
@keyframes pop{0%{transform:scale(.6) rotate(-14deg)}60%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1)}}
.result h2{font-family:var(--display);font-weight:800;font-size:clamp(2.3rem,8vw,3.4rem);line-height:1.05;margin:4px 0 0}
.result p{margin:0;font-weight:700;font-size:1.1rem;color:var(--muted);max-width:36ch}

/* credit */
.credit{display:flex;justify-content:center;margin-top:44px}
.credit span.pill2{display:inline-flex;align-items:center;gap:10px;padding:5px 18px;background:var(--card);
  border:2.5px solid var(--line);border-radius:999px;font-weight:800;font-size:.95rem}
.credit svg{width:20px;height:20px}
.credit svg path{fill:#FF6B8B;stroke:var(--line);stroke-width:1.6;stroke-linejoin:round}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- storage (light per-viewer convenience) ---------- */
function load(){ try{ return JSON.parse(localStorage.getItem('verb-safari')||'{}') || {}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem('verb-safari', JSON.stringify(store)); }catch(e){} }
var store = load();
var muted = !!store.muted;

/* ---------- sound (Web Audio, no files) ---------- */
var ctx = null;
function audio(){
  var AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  if(!ctx){ try{ ctx = new AC(); }catch(e){ return null; } }
  if(ctx.state === 'suspended'){ try{ ctx.resume(); }catch(e){} }
  return ctx;
}
function tone(freq, at, dur, type, vol, slideTo){
  if(muted) return;
  var a = audio(); if(!a) return;
  var t = a.currentTime + at;
  var o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || .16, t + .012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + .03);
}
var sfx = {
  tap: function(){ tone(700, 0, .06, 'triangle', .12); tone(940, .035, .05, 'triangle', .08); },
  good: function(d){ d = d||0; [523.25, 659.25, 783.99].forEach(function(f,i){ tone(f, d+.07+i*.09, .24, 'triangle', .17); }); },
  bad: function(d){ d = d||0; tone(230, d+.07, .3, 'sawtooth', .1, 110); },
  win: function(){ [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function(f,i){ tone(f, i*.1, .38, 'triangle', .17); }); },
  star: function(i){ tone(660 + i*220, 0, .3, 'sine', .2); tone(1320 + i*440, .06, .22, 'sine', .08); }
};
function drawSnd(){
  var b = document.getElementById('snd');
  b.innerHTML = muted ? SPK_OFF : SPK_ON;
  b.setAttribute('aria-pressed', String(!muted));
  b.setAttribute('aria-label', muted ? 'Sound off' : 'Sound on');
}
document.getElementById('snd').addEventListener('click', function(){
  muted = !muted; store.muted = muted; save(); drawSnd();
  if(!muted){ audio(); sfx.good(0); }
});
document.addEventListener('pointerdown', function(e){
  var t = e.target;
  if(!t.closest) return;
  if(t.closest('input')){ audio(); return; }
  if(t.closest('button') && !t.closest('.used') && !t.closest('#snd')){ audio(); sfx.tap(); }
});

/* ---------- helpers ---------- */
function starSVG(on){ return '<svg class="star'+(on?' on':'')+'" viewBox="0 0 24 24" aria-hidden="true"><path d="'+STAR+'"/></svg>'; }
function $(s){ return document.querySelector(s); }
function norm(v){ return String(v).toLowerCase().trim().replace(/[.!?,]+$/,'').replace(/\s+/g,' '); }
function hint(t){ var h = document.getElementById('hint'); if(h) h.textContent = t; }
function shake(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function markChip(w){
  var chips = document.querySelectorAll('.chip');
  for(var i=0;i<chips.length;i++){ if(chips[i].dataset.w === w){ chips[i].classList.remove('sel'); chips[i].classList.add('used'); } }
}
function plural(n, w){ return n + ' ' + w + (n===1?'':'s'); }

/* ---------- menu ---------- */
function menu(){
  S = null;
  screen.dataset.level = '';
  var cards = LEVELS.map(function(l, idx){
    var best = store.best && store.best[l.id];
    var chip = (best === undefined || best === null) ? '' :
      '<span class="bestchip">Best: ' + (best === 0 ? 'perfect run' : plural(best,'mistake')) + '</span>';
    return '<button type="button" class="lvcard" data-act="start" data-id="'+l.id+'" style="--lv:var(--l'+l.id+');--n:'+idx+'">' +
      '<span class="stars">' + [1,2,3].map(function(n){ return starSVG(n <= l.stars); }).join('') + '</span>' +
      '<span class="lname">'+l.name+'</span>' +
      '<span class="ldesc">'+l.menu+'</span>' + chip + '</button>';
  }).join('');
  screen.innerHTML =
    '<section class="hero"><h1>Verb <span class="sticker">Safari</span></h1>' +
    '<p class="lead">Animals act. You name the action. Pick a level to begin.</p></section>' +
    '<div class="levels">' + cards + '</div>';
  window.scrollTo(0,0);
}

/* ---------- level ---------- */
function start(id){
  var lv = LEVELS.filter(function(l){ return l.id === id; })[0];
  S = { lv: lv, done: lv.items.map(function(){ return false; }), mistakes: 0, selWord: null, selCard: null, last: null, finished: false };
  screen.dataset.level = id;
  var chips = lv.bank.map(function(w){ return '<button type="button" class="chip" data-act="chip" data-w="'+w+'">'+w+'</button>'; }).join('');
  var board = '';
  if(lv.type === 'match'){
    board = '<div class="grid">' + lv.items.map(function(it,i){
      return '<button type="button" class="pic" data-act="pic" data-i="'+i+'" aria-label="Picture '+(i+1)+'">' +
        '<span class="num">'+(i+1)+'</span><span class="art"><img src="'+IMG[it.img]+'" alt="'+it.alt+'"></span>' +
        '<span class="slot"></span><span class="tick">'+CHECK+'</span></button>';
    }).join('') + '</div>';
  } else if(lv.type === 'write'){
    board = '<div class="grid">' + lv.items.map(function(it,i){
      return '<div class="cardw" data-i="'+i+'"><span class="num">'+(i+1)+'</span>' +
        '<span class="art"><img src="'+IMG[it.img]+'" alt="'+it.alt+'"></span>' +
        '<input class="ans" id="ans'+i+'" data-i="'+i+'" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Verb for picture '+(i+1)+'">' +
        '<span class="tick">'+CHECK+'</span></div>';
    }).join('') + '</div>';
  } else {
    board = '<div class="sents">' + lv.items.map(function(it,i){
      return '<div class="srow" data-i="'+i+'"><span class="num">'+(i+1)+'</span>' +
        '<p class="sent">'+it.pre+'<input class="blank" id="ans'+i+'" data-i="'+i+'" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Verb for sentence '+(i+1)+'">'+it.post+'</p>' +
        '<span class="tick">'+CHECK+'</span></div>';
    }).join('') + '</div>';
  }
  var dots = lv.items.map(function(){ return '<span class="dot"></span>'; }).join('');
  screen.innerHTML =
    '<div class="bar"><button type="button" class="ghost" data-act="menu">'+ARROW+'Levels</button>' +
    '<div class="prog"><span class="dots" id="prog">'+dots+'</span><span class="plabel" id="plabel">0 / '+lv.items.length+'</span></div></div>' +
    '<div class="sechead"><span class="pill"><span class="stars">' + [1,2,3].map(function(n){ return starSVG(n <= lv.stars); }).join('') + '</span><b>'+lv.name+'</b></span>' +
    '<p class="instr"><span class="brush">'+lv.instr+'</span></p></div>' +
    '<div class="bank" role="group" aria-label="Word bank">'+chips+'</div>' +
    '<p class="hint" id="hint" aria-live="polite"></p>' + board +
    (lv.type === 'match' ? '' : '<div class="actions"><button type="button" class="primary" data-act="check">Check answers</button></div>');
  if(lv.type === 'match') updateHint();
  else hint('Type a verb, or tap a word to fill the next blank. Press Enter to check one answer.');
  window.scrollTo(0,0);
}

/* ---------- match level ---------- */
function updateHint(){
  var w = S.selWord, c = S.selCard;
  if(w && c === null) hint('“'+w+'” is selected. Now tap its picture.');
  else if(!w && c !== null) hint('Picture '+(c+1)+' is selected. Now tap its verb.');
  else hint('Tap a verb, then tap its picture.');
}
function refreshSel(){
  var chips = document.querySelectorAll('.chip');
  for(var i=0;i<chips.length;i++) chips[i].classList.toggle('sel', !chips[i].classList.contains('used') && chips[i].dataset.w === S.selWord);
  var pics = document.querySelectorAll('.pic');
  for(var j=0;j<pics.length;j++) pics[j].classList.toggle('sel', j === S.selCard);
  updateHint();
}
function tryEval(){
  if(S.selWord === null || S.selCard === null) return;
  var i = S.selCard, w = S.selWord;
  var pic = document.querySelectorAll('.pic')[i];
  if(S.lv.items[i].ans.indexOf(w) > -1){
    S.done[i] = true;
    pic.classList.add('ok'); pic.classList.remove('sel', 'bad');
    pic.querySelector('.slot').textContent = w;
    pic.setAttribute('aria-label', 'Picture '+(i+1)+': '+w);
    markChip(w);
    S.selWord = null; S.selCard = null;
    sfx.good(0); refreshSel(); progress();
    hint('Correct!');
  } else {
    S.mistakes++;
    var chip = null, chips = document.querySelectorAll('.chip');
    for(var k=0;k<chips.length;k++) if(chips[k].dataset.w === w) chip = chips[k];
    shake(pic); if(chip) shake(chip);
    pic.classList.add('bad');
    setTimeout(function(){ pic.classList.remove('bad'); }, 600);
    S.selWord = null; S.selCard = null;
    sfx.bad(0); refreshSel();
    hint('Not that one. Try another verb.');
  }
}

/* ---------- typing levels ---------- */
function checkOne(i, delay){
  if(S.done[i]) return null;
  var it = S.lv.items[i], inp = document.getElementById('ans'+i);
  var v = norm(inp.value);
  if(!v) return null;
  var wrap = inp.closest('[data-i]');
  if(it.ans.indexOf(v) > -1){
    S.done[i] = true; inp.readOnly = true; inp.blur();
    wrap.classList.add('ok'); wrap.classList.remove('bad');
    markChip(it.ans[0]);
    sfx.good(delay||0); progress();
    return true;
  }
  S.mistakes++;
  wrap.classList.add('bad'); shake(wrap);
  sfx.bad(delay||0);
  return false;
}
function checkAll(){
  var right = 0, wrong = 0, delay = 0;
  S.lv.items.forEach(function(_, i){
    var r = checkOne(i, delay);
    if(r === null) return;
    delay += .24;
    if(r) right++; else wrong++;
  });
  if(!right && !wrong) hint('Write at least one verb first.');
  else if(wrong) hint(wrong === 1 ? 'One answer needs another look. Check the word list.' : wrong+' answers need another look. Check the word list.');
  else hint('Correct!');
}

/* ---------- progress and result ---------- */
function progress(){
  var dots = document.querySelectorAll('#prog .dot');
  S.done.forEach(function(d,i){ if(dots[i]) dots[i].classList.toggle('on', d); });
  var n = S.done.filter(Boolean).length;
  var pl = document.getElementById('plabel'); if(pl) pl.textContent = n+' / '+S.done.length;
  if(n === S.done.length && !S.finished){ S.finished = true; setTimeout(result, 900); }
}
function result(){
  var m = S.mistakes, id = S.lv.id, stars = m === 0 ? 3 : (m <= 2 ? 2 : 1);
  store.best = store.best || {};
  if(store.best[id] === undefined || store.best[id] === null || m < store.best[id]) store.best[id] = m;
  save();
  var title = m === 0 ? 'Perfect run!' : (m <= 2 ? 'Nice work!' : 'You made it!');
  var line = 'You named all '+S.done.length+' verbs' + (m === 0 ? ' without a single mistake.' : ' with '+plural(m,'mistake')+'.');
  screen.innerHTML =
    '<section class="result"><div class="rstars" aria-label="'+stars+' of 3 stars">' + [0,1,2].map(function(){ return starSVG(false); }).join('') + '</div>' +
    '<h2>'+title+'</h2><p>'+line+'</p>' +
    '<div class="actions">' +
    (id < LEVELS.length ? '<button type="button" class="primary" data-act="next">Next level</button>' : '') +
    '<button type="button" class="ghost" data-act="again">Play again</button>' +
    '<button type="button" class="ghost" data-act="menu">All levels</button></div></section>';
  sfx.win();
  var els = screen.querySelectorAll('.rstars .star');
  for(var i=0;i<stars;i++){ (function(k){ setTimeout(function(){ els[k].classList.add('on'); sfx.star(k); }, 350 + k*330); })(i); }
  window.scrollTo(0,0);
}

/* ---------- events ---------- */
function onChip(b){
  var w = b.dataset.w;
  if(b.classList.contains('used')) return;
  if(S.lv.type === 'match'){
    S.selWord = (S.selWord === w) ? null : w;
    refreshSel(); tryEval();
    return;
  }
  var items = S.lv.items, i = -1, k;
  if(S.last !== null && !S.done[S.last] && !document.getElementById('ans'+S.last).value.trim()) i = S.last;
  if(i < 0) for(k=0;k<items.length;k++){ if(!S.done[k] && !document.getElementById('ans'+k).value.trim()){ i = k; break; } }
  if(i < 0 && S.last !== null && !S.done[S.last]) i = S.last;
  if(i < 0) for(k=0;k<items.length;k++){ if(!S.done[k]){ i = k; break; } }
  if(i < 0) return;
  var inp = document.getElementById('ans'+i);
  inp.value = w;
  inp.closest('[data-i]').classList.remove('bad');
  S.last = null;
  if(window.matchMedia && matchMedia('(hover:hover)').matches){ try{ inp.focus({preventScroll:true}); }catch(e){} }
}
function onPic(b){
  var i = +b.dataset.i;
  if(S.done[i]) return;
  S.selCard = (S.selCard === i) ? null : i;
  refreshSel(); tryEval();
}
screen.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]');
  if(!b) return;
  var a = b.dataset.act;
  if(a === 'start') start(+b.dataset.id);
  else if(a === 'menu') menu();
  else if(a === 'chip') onChip(b);
  else if(a === 'pic') onPic(b);
  else if(a === 'check') checkAll();
  else if(a === 'again') start(S.lv.id);
  else if(a === 'next') start(S.lv.id + 1);
});
screen.addEventListener('keydown', function(e){
  if(e.key !== 'Enter' || !e.target.matches || !e.target.matches('input')) return;
  e.preventDefault();
  var i = +e.target.dataset.i;
  if(S.done[i]) return;
  var r = checkOne(i, 0);
  if(r === null) hint('Type a verb first.');
  else if(r) hint('Correct!');
  else hint('Not quite. Check the word list and try again.');
});
screen.addEventListener('input', function(e){
  if(e.target.matches && e.target.matches('input')){
    var w = e.target.closest('[data-i]'); if(w) w.classList.remove('bad');
  }
});
screen.addEventListener('focusin', function(e){
  if(S && e.target.matches && e.target.matches('input')) S.last = +e.target.dataset.i;
});

drawSnd();
menu();
})();
</script>

</body></html>
